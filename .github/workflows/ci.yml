name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [corespeed]
    paths-ignore:
      - '**/*.md'

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Prettier
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Tests
        run: bunx vitest run
