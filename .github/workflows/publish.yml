name: Publish

# Publishes @corespeed/skills to npm. The version is whatever package.json says
# at the published ref; bump it in a commit, tag `v<version>`, publish a GitHub
# release for that tag (or run this workflow by hand on the tag).
#
# Needs one repository secret: NPM_TOKEN, a granular npm access token with
# read/write on the @corespeed scope and "bypass 2FA" enabled.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to publish (defaults to the ref the workflow runs on)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${{ inputs.ref || github.event.release.tag_name || github.ref_name }}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::ref '$TAG' does not match package.json version v$VERSION"
            exit 1
          fi

      - name: Type-check
        run: bun run type-check

      - name: Tests
        run: bunx vitest run

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
